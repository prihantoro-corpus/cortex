[server]
maxUploadSize = 1000
enableXsrfProtection = false
enableCORS = false
maxMessageSize = 1000
enableWebsocketCompression = false

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#00ADB5"
backgroundColor = "#0b132b"
secondaryBackgroundColor = "#1c2541"
textColor = "#FFFFFF"
font = "sans serif"
